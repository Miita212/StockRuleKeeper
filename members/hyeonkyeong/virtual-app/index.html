<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>가상 주식앱</title>
<style>
  body { margin: 0; font-family: "Noto Sans KR", sans-serif; background: #f4f6f9; color: #1b2230; }
  header { padding: 16px; background: #fff; position: sticky; top: 0; border-bottom: 1px solid #e3e8ee; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  header p { margin: 0 0 10px; font-size: 12px; color: #5f6b7a; }
  input { width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #e3e8ee; border-radius: 10px; font-size: 16px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #fff; border-bottom: 1px solid #e3e8ee; }
  .name { flex: 1; } .name b { display: block; } .name span { font-size: 12px; color: #5f6b7a; }
  .price { text-align: right; font-size: 14px; } .up { color: #d92d20; } .down { color: #1f5fea; }
  button { height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #1f5fea; color: #fff; font-weight: 700; cursor: pointer; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: #1b2230; color: #fff; font-size: 14px; display: none; }
</style>
</head>
<body>
<header>
  <h1>가상 주식앱 (시연용)</h1>
  <p>종목 옆 "공유하기"를 누르면 StockRuleKeeper 판정서가 열려요.</p>
  <input id="q" placeholder="종목명이나 코드를 검색해요" />
</header>
<div id="list"></div>
<div id="toast"></div>
<script>
  // 서버 주소: 이 페이지를 서버가 서빙하면 같은 주소, 따로 열면 ?api=http://노트북IP:8000
  const API = new URLSearchParams(location.search).get("api") || location.origin;
  let stocks = [];

  function render() {
    const q = document.getElementById("q").value.trim();
    document.getElementById("list").innerHTML = stocks
      .filter((s) => s.name.includes(q) || s.code.includes(q))
      .map((s) => {
        const up = s.changeRate >= 0;
        const price = s.price ? s.price.toLocaleString() + "원" : "-";
        return `<div class="item"><div class="name"><b>${s.name}</b><span>${s.code}</span></div>
          <div class="price"><div>${price}</div><div class="${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(s.changeRate)}%</div></div>
          <button onclick="share('${s.code}')">공유하기</button></div>`;
      }).join("");
  }

  async function share(code) {
    const r = await fetch(API + "/shares", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    const t = document.getElementById("toast");
    t.textContent = r.ok ? "StockRuleKeeper로 보냈어요" : "공유하지 못했어요";
    t.style.display = "block";
    setTimeout(() => (t.style.display = "none"), 2000);
  }

  document.getElementById("q").addEventListener("input", render);
  fetch(API + "/virtual/stocks").then((r) => r.json()).then((d) => { stocks = d; render(); });
</script>
</body>
</html>
